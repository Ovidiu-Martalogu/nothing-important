<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Create account</h2>
        </div>
        <form action="" class="form" id="form">
            <div class="form-control">
                <label for="username">Username</label>
                <input type="text" value="Insert your username" id="username">
                <button class="btn-username">Send</button>
            </div>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" value="aaa@aaaa.com" id="email">
                <i class="fas fa-check-circle"></i>
                <i class="fas fa-exclamation-circle"></i>
                <button class="btn-email">Send</button>
            </div>
            <div class="form-control">
                <label for="message">Message</label>
                <input type="text" value="Insert your message" id="message">
                <i class="fas fa-check-circle"></i>
                <i class="fas fa-exclamation-circle"></i>
                <button class="btn-message">Send</button>
            </div>
        </form>
    </div>
    <div class="container-msg">You message is:</div>
</body>

</html>
